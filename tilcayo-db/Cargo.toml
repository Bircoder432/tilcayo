[package]
name = "tilcayo-db"
version = "0.1.0"
edition = "2024"

[dependencies]
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "migrate"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
tilcayo-core.workspace = true
serde_json = "1.0.151"
redis = { version = "1.7.0", features = ["tokio-comp"] }
